[build-system]
requires = ["setuptools>=65.5.3"]
build-backend = "setuptools.build_meta"

[project]
name = "splatguide"
version = "0.1.0"
description = "SplatGuide: Geometric Priors from 3D Gaussians for Pose-Free Novel View Synthesis"
requires-python = ">=3.10"
# Tested versions (Python 3.10, CUDA 12.4). gsplat: pip install gsplat==1.5.3 --index-url https://docs.gsplat.studio/whl/pt24cu124
dependencies = [
    "torch==2.4.0",
    "torchvision==0.19.0",
    "pytorch-lightning==2.5.2",
    "omegaconf==2.3.0",
    "einops==0.8.1",
    "numpy==1.24.4",
    "safetensors==0.6.2",
    "diffusers==0.35.2",
    "huggingface-hub==0.36.0",
    "open-clip-torch==3.2.0",
    "kornia==0.8.1",
    "torchmetrics[image]==1.8.2",
    "gsplat==1.5.3",
    "fire==0.7.1",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
wandb = ["wandb"]

[tool.setuptools.packages.find]
include = ["seva*", "recon*", "training*"]
